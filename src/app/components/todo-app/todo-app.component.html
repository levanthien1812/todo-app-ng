<div class="min-h-screen">
  <div class="container mx-auto w-[500px] mt-12 flex flex-col items-center">
    <app-todo-filter [(showFilter)]="showFilter" [filter]="filter" />
    <button
      class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded mt-6"
      mat-raised-button
      (click)="openTodo()"
    >
      Add todo
    </button>
    <app-todo-list [todos]="todos$" />
  </div>
</div>
<router-outlet />
