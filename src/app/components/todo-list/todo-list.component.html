<div class="mt-6">
  <ul class="list-none space-y-2" *ngIf="todos | async as todos">
    <li *ngFor="let todo of todos">
      <app-todo-item
        [todoItem]="todo"
        (statusChanged)="onChangeStatus($event)"
      />
    </li>

    <p *ngIf="!todos!.length" class="text-2xl text-center text-gray-600 mt-4">
      No todos found
    </p>
  </ul>
</div>
